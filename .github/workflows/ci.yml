name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (undefined names, unused imports)
        run: ruff check --select F services loadgen.py
      - name: Check all Python files compile
        run: python -m compileall -q services loadgen.py

  build-scan-push:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - ai-incident-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: sentinelops/${{ matrix.service }}:ci

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            sentinelops/${{ matrix.service }}:ci

      - name: Lowercase owner name (GHCR requires lowercase)
        if: github.event_name == 'push'
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/sentinelops-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/sentinelops-${{ matrix.service }}:latest
