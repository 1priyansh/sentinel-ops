{{- range .Values.services }}
{{- $tag := .tag | default $.Values.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .replicas | default 1 }}
  {{- if .persistence }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .persistence }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.prefix }}{{ .name }}:{{ $tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if .persistence }}
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          {{- if .envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .envFromSecret }}
                optional: true
          {{- end }}
      {{- if .persistence }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .name }}-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: 8000
      targetPort: 8000
---
{{- if .persistence }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-data
  namespace: {{ $.Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .persistence.size | default "100Mi" }}
---
{{- end }}
{{- end }}
