services:
  gateway:
    build: {context: ./services, args: {SERVICE: gateway}}
    ports: ['8000:8000']
  user-service:
    build: {context: ./services, args: {SERVICE: user-service}}
  product-service:
    build: {context: ./services, args: {SERVICE: product-service}}
  order-service:
    build: {context: ./services, args: {SERVICE: order-service}}
  payment-service:
    build: {context: ./services, args: {SERVICE: payment-service}}
  ai-incident-assistant:
    build: {context: ./services, args: {SERVICE: ai-incident-assistant}}
    ports: ['8080:8000']
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
  loadgen:
    image: python:3.12-slim
    command: sh -c "pip install -q httpx && python /load.py"
    volumes: ['./loadgen.py:/load.py:ro']
    depends_on: [gateway]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro', './monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro']
    ports: ['9090:9090']
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ['./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    ports: ['9093:9093']
  loki:
    image: grafana/loki:2.9.8
    ports: ['3100:3100']
  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes: ['./monitoring/promtail.yml:/etc/promtail/config.yml:ro', '/var/run/docker.sock:/var/run/docker.sock']
  grafana:
    image: grafana/grafana:11.1.0
    environment: [GF_AUTH_ANONYMOUS_ENABLED=true, GF_AUTH_ANONYMOUS_ORG_ROLE=Admin]
    volumes: ['./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro']
    ports: ['3000:3000']
