apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: sentinelops }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: sentinelops/gateway:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: sentinelops }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
