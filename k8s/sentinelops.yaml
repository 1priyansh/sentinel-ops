apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: sentinelops }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            [
              { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" },
              { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin },
            ]
          volumeMounts:
            [{ name: cfg, mountPath: /etc/grafana/provisioning/datasources }]
      volumes: [{ name: cfg, configMap: { name: grafana-ds } }]
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: sentinelops }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: sentinelops }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: python:3.12-slim
          command: [sh, -c, "pip install -q httpx && python /load/loadgen.py"]
          volumeMounts: [{ name: cfg, mountPath: /load }]
      volumes: [{ name: cfg, configMap: { name: loadgen } }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: promtail, namespace: sentinelops }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: promtail }
rules:
  [
    {
      apiGroups: [""],
      resources: [pods, nodes, services, endpoints],
      verbs: [get, list, watch],
    },
  ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: promtail }
roleRef:
  { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promtail }
subjects: [{ kind: ServiceAccount, name: promtail, namespace: sentinelops }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: promtail, namespace: sentinelops }
spec:
  selector: { matchLabels: { name: promtail } }
  template:
    metadata: { labels: { name: promtail } }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args: ["-config.file=/etc/promtail/promtail-k8s.yml"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - { name: cfg, mountPath: /etc/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - { name: cfg, configMap: { name: promtail-config } }
        - { name: pods, hostPath: { path: /var/log/pods } }
